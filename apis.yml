- aid: sec:sec-submission-status-api-api
  name: SEC EDGAR Submission Status API
  description: "The Submission Status API provides information from the EDGAR system. It requires a Filer\
    \ API Token and accession number(s). To obtain information about a submission through the Submission\
    \ Status API,\n    you must use a Filer API Token that belongs to the CIK that submitted the filing\
    \ or the CIK that was the filer for the submission. The Submission Status API will only return the\
    \ detailed information about\n    the filling (like error codes or the filer notification text) once\
    \ the filing has reached the end of processing signified by the field 'final' being set to true.\n\
    \    \n\n    The statuses of filings are retained for limited amounts of time. The statuses of Accepted\
    \ TEST filings are retained for two (2) days,  Accepted LIVE filings are retained for sixty (60) days,\
    \ and Suspended filings,\n    regardless of type, are retained for six (6) days."
  humanURL: https://www.sec.gov/edgar/sec-api-documentation
